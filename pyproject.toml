[project]
name = "maritime-uav"
version = "0.1.0"
description = "Self-contained Monte Carlo simulation for maritime-UAV sensor-security framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0.0",
    "scipy>=1.14.0",
    "scikit-learn>=1.5.0",
    "matplotlib>=3.9.0",
]

[project.scripts]
run-sim = "maritime_uav.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
